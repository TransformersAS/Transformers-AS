# Plantilla: la imagen oficial de nginx la copia a conf.d al arrancar sustituyendo solo las variables de entorno
# que empiezan por BACKEND_ (NGINX_ENVSUBST_FILTER en el Dockerfile); las variables de nginx van en minúscula.

# The local frontend is reached directly over HTTP or through the trusted HTTPS tunnel.
# Preserve its original scheme so Spring sees same-origin HTTPS and emits Secure cookies.
map $http_x_forwarded_proto $marketplace_forwarded_proto {
    default $scheme;
    https https;
}

# Balanceo de carga hacia el backend.
# DNS interno de Docker; se vuelve a consultar cada 5 s para seguir las réplicas que Swarm crea o retira.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream backend_upstream {
    # Memoria compartida entre workers: necesaria para resolver el nombre en caliente.
    zone backend_upstream 64k;
    # En Swarm, BACKEND_UPSTREAM_HOST=tasks.backend devuelve la IP de cada réplica, así nginx reparte
    # petición por petición (round robin) y puede reintentar en otra. Con "backend" a secas Swarm devolvería
    # una sola IP virtual. En Compose "backend" ya devuelve las IP de los contenedores.
    # Una réplica que falla deja de recibir tráfico 10 s, mientras el DNS la retira del todo.
    server ${BACKEND_UPSTREAM_HOST}:8080 resolve max_fails=1 fail_timeout=10s;
    # Conexiones inactivas reutilizables por worker hacia la API.
    keepalive 128;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Qué réplica del frontend y qué réplica(s) del backend atendieron la petición: permite verificar el reparto
    # (scripts/quality/run.py balancing) y ver un reintento ("10.0.1.5:8080, 10.0.1.6:8080").
    add_header X-Served-By-Frontend $hostname always;
    add_header X-Served-By-Backend $upstream_addr always;

    # Si una réplica no acepta la conexión o no responde, la petición pasa a la otra. Solo errores de conexión
    # y tiempo de espera (los valores por defecto de nginx): un 5xx que devuelve la aplicación no se repite, y
    # nginx nunca reintenta un POST/PUT/DELETE ya enviado.
    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;
    # Una réplica caída no responde: sin esto nginx esperaría 60 s antes de probar la otra.
    proxy_connect_timeout 2s;

    # Probe del proceso web. La disponibilidad de la API se comprueba por
    # separado en /api/actuator/health/readiness.
    location = /healthz {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /api/actuator/health/readiness {
        proxy_pass http://backend_upstream/actuator/health/readiness;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $marketplace_forwarded_proto;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $marketplace_forwarded_proto;
    }

    location = /api {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $marketplace_forwarded_proto;
    }
}
