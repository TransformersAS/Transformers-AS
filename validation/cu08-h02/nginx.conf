# Only the isolated H02 project mounts this template.
log_format h02_origin 'h02-nginx origin=$remote_addr status=$status';
resolver 127.0.0.11 valid=5s ipv6=off;
upstream h02_backend {
    zone h02_backend 64k;
    # Use only the private proxy network; backend also joins the entry network.
    server 172.30.240.11:8080;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout h02_origin;
    location = /healthz { return 200 'ok'; }
    location / { try_files $uri $uri/ /index.html; }
    location /api/ {
        proxy_pass http://h02_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
