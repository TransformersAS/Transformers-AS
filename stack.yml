version: "3.8"

services:
  frontend:
    image: ghcr.io/transformersas/transformers-as-frontend:${FRONTEND_IMAGE_TAG:-latest}
    networks:
      - internal
    ports:
      - target: 80
        published: ${FRONTEND_HOST_PORT:-80}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.labels.backend_zone
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 90s

  backend:
    image: ghcr.io/transformersas/transformers-as-backend:${BACKEND_IMAGE_TAG:-latest}
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace_app}
      # Opcional: correo de la cuenta VENDEDOR que será dueña de la tienda principal (ver docs/swarm.md).
      MAIN_STORE_OWNER_EMAIL: ${MAIN_STORE_OWNER_EMAIL:-}
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
    secrets:
      - source: db_password
        target: DB_PASSWORD
        uid: "10001"
        gid: "10001"
        mode: 0400
      # El nombre del archivo es la propiedad que lee Spring: sin este secreto el webhook del
      # servicio logistico queda cerrado y CU-24/CU-25 no reciben novedades (401 WEBHOOK_NOT_CONFIGURED).
      - source: logistics_webhook_secret
        target: logistics.webhook.secret
        uid: "10001"
        gid: "10001"
        mode: 0400
    networks:
      - internal
    ports:
      - target: 8080
        published: ${BACKEND_HOST_PORT:-8080}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 2
      placement:
        preferences:
          - spread: node.labels.backend_zone
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 90s

  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DB_NAME:-marketplace}
      MYSQL_USER: ${DB_USER:-marketplace_app}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - source: db_password
        target: db_password
      - source: mysql_root_password
        target: mysql_root_password
    networks:
      - internal
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/db_password)" mysql --protocol=TCP
          --host=127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --execute="SELECT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.id == ${MYSQL_NODE_ID:?Set MYSQL_NODE_ID to the database manager node ID}
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: pause
      rollback_config:
        parallelism: 1
        order: stop-first

networks:
  internal:
    driver: overlay

volumes:
  mysql_data:
    driver: local

secrets:
  db_password:
    external: true
    name: ${DB_PASSWORD_SECRET:?Set DB_PASSWORD_SECRET}
  mysql_root_password:
    external: true
    name: ${MYSQL_ROOT_PASSWORD_SECRET:?Set MYSQL_ROOT_PASSWORD_SECRET}
  logistics_webhook_secret:
    external: true
    name: ${LOGISTICS_WEBHOOK_SECRET:?Set LOGISTICS_WEBHOOK_SECRET}
