spring.application.name=marketplace

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marketplace}
spring.datasource.username=${DB_USER:marketplace_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns schema changes; Hibernate only validates the existing schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

# Expose only health, without datasource or system details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Capacity only; cache names, limits and TTL require a real use case.
spring.cache.type=caffeine

server.port=8080

# Subida de imagenes (CU-18, RNF-007): 5 MB por archivo; ImageValidator vuelve a comprobarlo sobre el contenido.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Duena de la tienda principal (tienda 1, anterior a CU-18). Vacia por defecto: no se toca nada. Con un correo, al
# arrancar se asigna a esa cuenta solo si la tienda no tiene duena y la cuenta tiene el rol VENDEDOR (docs/swarm.md).
stores.main-store-owner-email=${MAIN_STORE_OWNER_EMAIL:}

# Flyway exclusively owns the JDBC session schema.
spring.session.jdbc.initialize-schema=never
spring.session.timeout=30m

# Cada linea de log lleva el id de correlacion (RNF-038); lo publica CorrelationIdFilter en el MDC.
logging.pattern.correlation=[%X{correlationId:-}]\u0020

# --- Logistica (CU-23). Contrato: docs/contracts/logistics-api.md ---
# simulated (por defecto, en proceso) o http. Toda llamada externa tiene timeout maximo de 10 s (RNF-042)
# y usa HTTPS salvo pruebas locales (RNF-001).
logistics.provider=simulated
logistics.simulated.mode=OK
# Metodos de envio que ofrece el marketplace y que una tienda puede habilitar (CU-18, RF-061).
logistics.shipping-methods=STANDARD,EXPRESS
logistics.http.timeout=10s
logistics.http.require-https=true
# logistics.http.base-url=https://...

# Circuit Breaker de logistica: solo los fallos temporales cuentan; el rechazo definitivo (4xx) se ignora.
# Sin reintentos automaticos: crear un envio se reintenta manualmente, de forma segura por Idempotency-Key.
resilience4j.circuitbreaker.instances.logistics.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.logistics.sliding-window-size=10
resilience4j.circuitbreaker.instances.logistics.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.logistics.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.logistics.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.logistics.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.logistics.record-exceptions=com.transformersas.marketplace.logistics.domain.model.LogisticsUnavailableException
resilience4j.circuitbreaker.instances.logistics.ignore-exceptions=com.transformersas.marketplace.logistics.domain.model.LogisticsRejectedException

# --- Notificaciones (CU-23). Contrato: docs/contracts/notifications-api.md ---
# La notificacion interna siempre se guarda; el aviso externo sale despues del commit y su fallo nunca la afecta.
notifications.provider=simulated
notifications.simulated.mode=OK
notifications.http.timeout=10s
notifications.http.require-https=true
# notifications.http.base-url=https://...

resilience4j.circuitbreaker.instances.notifications.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.notifications.sliding-window-size=10
resilience4j.circuitbreaker.instances.notifications.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.notifications.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.notifications.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.notifications.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.notifications.record-exceptions=com.transformersas.marketplace.notifications.domain.model.ExternalNotificationUnavailableException
resilience4j.circuitbreaker.instances.notifications.ignore-exceptions=com.transformersas.marketplace.notifications.domain.model.ExternalNotificationRejectedException
# Browser origins allowed to call the API with the session cookie (comma separated). Use the real frontend origin in production.
app.cors.allowed-origins=http://localhost:4300,http://localhost:4200,http://localhost:8100

# --- Seguimiento logistico (CU-24 y CU-25) ---
# Webhook: el servicio logistico firma cada cuerpo con HMAC-SHA256 (cabecera X-Logistics-Signature: sha256=hex).
# Sin secreto el webhook queda cerrado. Debe ser un valor largo y aleatorio en cada despliegue; nunca se commitea.
logistics.webhook.secret=
# Consulta periodica de envios y devoluciones activos (A7), consulta pedida por el usuario (intervalo minimo entre
# consultas del mismo envio) y tamano de cada barrido. Las pruebas desactivan el barrido.
logistics.tracking.polling-enabled=true
logistics.tracking.polling-interval=30s
logistics.tracking.polling-batch-size=20
logistics.tracking.refresh-min-interval=5s
# Proveedor simulado: NONE (solo lo que encolen las pruebas) o HAPPY_PATH (avanza solo cada "step", para la demo).
logistics.simulated.script=NONE
logistics.simulated.step=15s
