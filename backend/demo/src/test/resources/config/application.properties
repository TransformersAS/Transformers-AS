# Las pruebas no arrancan el barrido periodico de seguimiento logistico: lo invocan directamente.
logistics.tracking.polling-enabled=false

# Secreto del webhook logistico solo para pruebas (los tests firman con el mismo valor).
logistics.webhook.secret=test-webhook-secret

# Las pruebas no arrancan la revision periodica de alertas de stock (CU-15): invocan el servicio directamente.
inventory.alerts.scheduling-enabled=false

# Las pruebas no arrancan el barrido periodico de devoluciones: lo invocan directamente.
returns.sweep.enabled=false

# Cached test contexts share MySQL: do not eagerly keep 10 idle connections per pool.
# Keep the normal 10-connection ceiling for concurrent/REQUIRES_NEW tests.
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10

# Each integration test cleans its own fixtures. Cached Spring contexts must not run
# concurrent session janitors against the same MySQL while those fixtures are being reset.
# Expiration is still enforced when a session is read and covered by the session suites.
spring.session.jdbc.cleanup-cron=-

# Legacy checkout contract is exercised only by tests, never enabled in the running application.
payments.mock-enabled=true
