# Spring TestContext reads this before Boot application properties. Test classpath only.
# Spy beans, SMTP ports and fault-injection properties create distinct contexts/pools
# against the singleton MySQL. Retain at most 8 instead of 32; LRU eviction closes
# the context and its Hikari pool. Even at 10 connections/pool this leaves headroom
# below MySQL's default 151 for the next context, Flyway and migration-test connections.
spring.test.context.cache.maxSize=8
