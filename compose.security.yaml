# Exclusivo del runner scripts/security/run.py. No combinar con otros Compose.
# Sin interpolación, env_file, puertos publicados ni volúmenes persistentes.
services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: security_zap
      MYSQL_USER: security_fixture
      MYSQL_PASSWORD: security_database_fixture_only
      MYSQL_ROOT_PASSWORD: security_root_fixture_only
    tmpfs:
      - /var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 1g
  backend:
    build: ./backend/demo
    environment:
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_NAME: security_zap
      DB_USER: security_fixture
      DB_PASSWORD: security_database_fixture_only
      SPRING_PROFILES_ACTIVE: ''
      SPRING_PROFILES_INCLUDE: ''
      MARKETPLACE_DEMO_DATA: 'false'
      PAYMENTS_MOCK_ENABLED: 'false'
      PAYMENTS_RECOVERY_ENABLED: 'false'
      MERCADOPAGO_ACCESS_TOKEN: ''
      MERCADOPAGO_WEBHOOK_SECRET: ''
      GEMINI_API_KEY: ''
      SPRING_MAIL_HOST: ''
      NOTIFICATIONS_QUEUE_ENABLED: 'false'
      NOTIFICATIONS_PUSH_ENABLED: 'false'
      LOGISTICS_PROVIDER: simulated
      NOTIFICATIONS_PROVIDER: simulated
      LOGISTICS_TRACKING_POLLING_ENABLED: 'false'
      LOGISTICS_SIMULATED_SCRIPT: NONE
      METRICS_TOKEN: ''
    networks: [database, target]
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '4', http://127.0.0.1:8080/actuator/health/readiness]
      interval: 5s
      timeout: 5s
      retries: 50
      start_period: 30s
    mem_limit: 1536m
  frontend:
    build: ./frontend
    environment:
      BACKEND_UPSTREAM_HOST: backend
    networks: [target]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/healthz && wget -q -O /dev/null http://127.0.0.1/api/actuator/health/readiness']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
  zap:
    # Índice multi-arquitectura verificado; no se resuelve un tag flotante al ejecutar.
    image: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
    profiles: [scan]
    entrypoint: [python3, /security/scan.py]
    volumes:
      - ./scripts/security:/security:ro
    networks: [target]
    healthcheck:
      disable: true
    mem_limit: 2g
networks:
  database:
    internal: true
  target:
    internal: true
