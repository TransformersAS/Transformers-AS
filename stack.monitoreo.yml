version: "3.8"

# Monitoreo del Marketplace: uso de CPU y memoria, peticiones, tiempos de respuesta y pool de conexiones.
# Va en un stack aparte para poder prenderlo y apagarlo sin tocar la aplicación. Se despliega con monitoreo.sh,
# después de deploy.sh.

services:
  # Un cAdvisor por computador del clúster: mide CPU y memoria de cada contenedor de ese equipo.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.swarm.service.name,com.docker.swarm.task.name,com.docker.swarm.node.id
      - --disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - monitoreo
    deploy:
      mode: global
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 10s

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Es un tablero de demostración: dos días de historia bastan y no llenan el disco.
      - --storage.tsdb.retention.time=2d
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    secrets:
      - source: metrics_token
        target: metrics_token
    networks:
      - monitoreo
      # La red interna de la aplicación: por ahí alcanza a cada réplica del backend. No se publica ningún puerto.
      - aplicacion
    volumes:
      - prometheus_data:/prometheus
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: any
        delay: 10s

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      # El tablero se ve sin iniciar sesión y en solo lectura. La cuenta de administración queda con una
      # contraseña aleatoria (secret) y sin formulario de entrada: nadie edita desde el navegador.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/marketplace.json
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/marketplace.yml
      - source: grafana_dashboard_marketplace
        target: /etc/grafana/dashboards/marketplace.json
    secrets:
      - source: grafana_admin_password
        target: grafana_admin_password
    networks:
      - monitoreo
    ports:
      - target: 3000
        published: ${GRAFANA_HOST_PORT:-3000}
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 384M
      restart_policy:
        condition: any
        delay: 10s

networks:
  monitoreo:
    driver: overlay
  aplicacion:
    external: true
    name: ${APP_NETWORK:?Set APP_NETWORK to the application stack network}

volumes:
  prometheus_data:
    driver: local

configs:
  # El nombre lleva la huella del contenido: Swarm no deja modificar un config, así que un cambio crea uno nuevo.
  prometheus_config:
    name: ${MONITORING_STACK:?Set MONITORING_STACK}_prometheus_${PROMETHEUS_CONFIG_HASH:?Set PROMETHEUS_CONFIG_HASH}
    file: ./monitoring/prometheus.yml
  grafana_datasource:
    name: ${MONITORING_STACK}_datasource_${GRAFANA_DATASOURCE_HASH:?Set GRAFANA_DATASOURCE_HASH}
    file: ./monitoring/grafana-datasource.yml
  grafana_dashboards:
    name: ${MONITORING_STACK}_dashboards_${GRAFANA_DASHBOARDS_HASH:?Set GRAFANA_DASHBOARDS_HASH}
    file: ./monitoring/grafana-dashboards.yml
  grafana_dashboard_marketplace:
    name: ${MONITORING_STACK}_tablero_${GRAFANA_DASHBOARD_HASH:?Set GRAFANA_DASHBOARD_HASH}
    file: ./monitoring/grafana-tablero.json

secrets:
  metrics_token:
    external: true
    name: ${METRICS_TOKEN_SECRET:?Set METRICS_TOKEN_SECRET}
  grafana_admin_password:
    external: true
    name: ${GRAFANA_ADMIN_PASSWORD_SECRET:?Set GRAFANA_ADMIN_PASSWORD_SECRET}
