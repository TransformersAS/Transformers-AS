# Host Spring Boot uses localhost:3307; the backend service uses mysql:3306.
# Initialization variables apply only when the data volume is empty.
services:
  frontend:
    build:
      context: ./frontend
    environment:
      # Alias definido SOLO en login_proxy; nunca resolver la interfaz de web_entry.
      BACKEND_UPSTREAM_HOST: backend-login-proxy
    volumes:
      # Solo Compose: Swarm conserva la plantilla de la imagen.
      - ./frontend/nginx.compose.conf:/etc/nginx/templates/default.conf.template:ro
    networks:
      web_entry:
      login_proxy:
        ipv4_address: 172.30.238.10
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4300}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend/demo
    environment:
      DB_HOST: mysql
      PAYMENTS_RECOVERY_ENABLED: ${PAYMENTS_RECOVERY_ENABLED:-false}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_COLLECTOR_ID: ${MERCADOPAGO_COLLECTOR_ID:-}
      MERCADOPAGO_RETURN_URL: ${MERCADOPAGO_RETURN_URL:-}
      MERCADOPAGO_NOTIFICATION_URL: ${MERCADOPAGO_NOTIFICATION_URL:-}
      SPRING_PROFILES_INCLUDE: compose-local
      SERVER_FORWARD_HEADERS_STRATEGY: native
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: '\Q172.30.238.10\E'
      SERVER_TOMCAT_REMOTEIP_TRUSTED_PROXIES: ''
      SERVER_TOMCAT_REMOTEIP_REMOTE_IP_HEADER: X-Forwarded-For
      SERVER_TOMCAT_REMOTEIP_PROTOCOL_HEADER: X-Forwarded-Proto
      APP_AUTH_LOGIN_ATTEMPTS_TRUSTED_PROXY_ADDRESSES: 172.30.238.10
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-marketplace}
      DB_USER: ${DB_USER:-marketplace_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # Shared SMTP transport, with independent senders for verification and password recovery.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      EMAIL_VERIFICATION_FROM: ${EMAIL_VERIFICATION_FROM:-}
      PASSWORD_RECOVERY_FROM: ${PASSWORD_RECOVERY_FROM:-}
      # Opcional, solo desarrollo: SPRING_PROFILES_ACTIVE=local crea la cuenta y el producto demo (ver .env.example).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      # La base arranca con datos de demostración (cuentas de cada rol, catálogo, pedidos, devoluciones y una
      # reclamación). Solo completa lo que falta; MARKETPLACE_DEMO_DATA=false lo apaga.
      MARKETPLACE_DEMO_DATA: ${MARKETPLACE_DEMO_DATA:-true}
      # Opcional: correo de la cuenta VENDEDOR que será dueña de la tienda principal (ver docs/swarm.md).
      MAIN_STORE_OWNER_EMAIL: ${MAIN_STORE_OWNER_EMAIL:-}
      # Seguimiento logístico (CU-24/CU-25). Sin secreto el webhook del proveedor queda cerrado; en demostración,
      # LOGISTICS_SIMULATED_SCRIPT=HAPPY_PATH hace avanzar cada envío por sí solo cada LOGISTICS_SIMULATED_STEP.
      LOGISTICS_WEBHOOK_SECRET: ${LOGISTICS_WEBHOOK_SECRET:-}
      LOGISTICS_SIMULATED_SCRIPT: ${LOGISTICS_SIMULATED_SCRIPT:-NONE}
      LOGISTICS_SIMULATED_STEP: ${LOGISTICS_SIMULATED_STEP:-15s}
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      web_entry:
      database:
      login_proxy:
        ipv4_address: 172.30.238.11
        aliases:
          - backend-login-proxy
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4.11
    networks:
      database:
      mysql_host:
    environment:
      MYSQL_DATABASE: ${DB_NAME:-marketplace}
      MYSQL_USER: ${DB_USER:-marketplace_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --host=127.0.0.1 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --execute="SELECT 1" > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  mysql_data:

# Direcciones exclusivas de este proyecto; nunca confiar en toda la subred.
networks:
  # Bridges por proyecto: permiten publicar SOLO los puertos loopback indicados.
  # Docker asigna subredes; comprobar también rutas LAN/VPN antes de desplegar.
  web_entry:
    driver: bridge
    internal: false
  mysql_host:
    driver: bridge
    internal: false
  database:
    driver: bridge
    internal: true
  login_proxy:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.238.0/24
